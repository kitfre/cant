name: Native runner
on: [push, pull_request]
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup default stable
      - if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - run: cargo test --workspace --locked
      - run: python3 scripts/test-native-runner.py
