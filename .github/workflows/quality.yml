name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --log-opts=--all "$GITHUB_WORKSPACE"
      - run: rustup component add --toolchain stable rustfmt clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build daemon and Steel runner for Pi integration tests
        run: cargo +stable build --locked -p cant --bins
      - name: Test Pi adapter
        working-directory: adapters/pi
        env:
          CANT_BIN: ${{ github.workspace }}/target/debug/cant
        run: |
          npm ci --ignore-scripts
          npm test
