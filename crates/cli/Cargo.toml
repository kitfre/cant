[package]
name = "cant"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "cant"

[[bin]]
name = "cant"
path = "src/main.rs"

[[bin]]
name = "cant-steel-runner"
path = "steel/main.rs"

[dependencies]
cant-host = { path = "../host" }
cant-lang-steel = { path = "../lang-steel" }
cant-protocol = { path = "../protocol" }
clap = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
steel-core = { version = "=0.8.3", default-features = false, features = ["std", "sandbox"] }
tokio = { workspace = true }
